[tool.poetry]
name = "bento_beacon"
version = "0.26.4"
description = "GA4GH Beacon v2 microservice for the Bento platform"
authors = ["Gordon Krieger <gordon.krieger@mcgill.ca>"]
license = "LGPL-3.0-only"
readme = "README.md"
packages = [{include = "bento_beacon"}]

[tool.poetry.dependencies]
python = "^3.12"
bento-lib = {extras = ["flask"], version = "^17.2.0"}
flask = {extras = ["async"], version = "^3.1.2"}
requests = "^2.33.0"
aiohttp = "^3.14.1"
aiocache = "^0.12.3"
werkzeug = "^3.1.5"

[tool.poetry.group.dev.dependencies]
debugpy = "^1.8.17"
black = "^26.1.0"
pytest = "^9.0.2"
responses = "^0.26.0"
pytest-cov = "^7.0.0"
aiointercept = "^0.1.6"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
